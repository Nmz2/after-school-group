<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>After School Group</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div id="app">

    <header class="site-header">
      <h1>After School Group</h1>
      <button class="cart-btn" @click="showCart = !showCart">
        Cart ({{ cart.length }})
      </button>
    </header>

    <main>
  <input v-model="search" class="search-box" placeholder="Search subject or location">

  <div class="lessons">
    <article v-for="lesson in filteredLessons" :key="lesson.id" class="lesson">
      <img :src="lesson.image" :alt="lesson.alt">
      <div class="lesson-body">
        <h2>{{ lesson.subject }}</h2>
        <p class="location">{{ lesson.location }}</p>
        <p class="price">Rs {{ lesson.price }}</p>
        <p v-if="lesson.spaces === 0" class="sold-out">Sold out</p>
        <p v-else class="spaces">{{ lesson.spaces }} spaces left</p>
        <button @click="addToCart(lesson)" :disabled="lesson.spaces === 0">
          Add to cart
        </button>
      </div>
    </article>
  </div>
</main>
  </div>
</body>
</html>
